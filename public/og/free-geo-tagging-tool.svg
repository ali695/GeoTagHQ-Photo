<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f8fafc" />
  <rect width="1200" height="630" fill="url(#gradient)" />
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
  </defs>
  
  <g transform="translate(600, 315)">
    <!-- Map Pin Icon -->
    <path d="M0 -120 C-45 -120, -80 -85, -80 -40 C-80 15, 0 120, 0 120 C0 120, 80 15, 80 -40 C80 -85, 45 -120, 0 -120 Z" fill="#2563eb" />
    <circle cx="0" cy="-40" r="30" fill="#ffffff" />
    
    <!-- Camera indicator inside the pin -->
    <path d="M-15 -45 h30 v20 h-30 z M-5 -50 h10 v5 h-10 z" fill="#2563eb" />
    <circle cx="0" cy="-35" r="5" fill="#ffffff" />
  </g>

  <!-- Text -->
  <text x="600" y="480" font-family="system-ui, sans-serif" font-weight="bold" font-size="64" fill="#1e293b" text-anchor="middle">GeoTagHQ</text>
  <text x="600" y="540" font-family="system-ui, sans-serif" font-weight="normal" font-size="32" fill="#475569" text-anchor="middle">Free Geo Tagging Tool</text>
</svg>
